# One stack = one command: `docker compose up -d --build`.
# Caddy terminates HTTPS (auto Let's Encrypt via the DOMAIN env);
# llm-proxy listens on localhost only — Caddy is the public door.

services:
  llm-proxy:
    build: .
    container_name: llm-proxy
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8002:8002"   # localhost-only; public traffic comes via Caddy
    volumes:
      - ./data:/app/data        # api-keys.json, dashboard-prefs.json, usage-stats.json

  dashboard:
    build: ./dashboard
    image: dashboard:prod        # pin the tag so a laptop-built image can be loaded and used
    container_name: dashboard
    restart: unless-stopped
    env_file: .env              # runtime ADMIN_TOKEN for the proxy token injection
    environment:
      DB_PATH: /app/data/app.db  # shared SQLite: users/sessions/usage (see lib/db.ts)
    volumes:
      - ./data:/app/data        # app.db lives next to api-keys/usage-stats JSON
    depends_on:
      - llm-proxy

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - llm-proxy
      - dashboard
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"           # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}         # interpolated from ./.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
